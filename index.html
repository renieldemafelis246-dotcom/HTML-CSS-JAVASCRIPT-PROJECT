<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Expense Tracker</h1>

        <form id="expense-form">
            <div class="form-group">
                <label for="expense-name">Expense Name:</label>
                <input type="text" id="expense-name" placeholder="Enter expense name" required>
            </div>

            <div class="form-group">
                <label for="amount">Amount (₱):</label>
                <input type="number" id="amount" min="0" step="0.01" placeholder="Enter amount" required>
            </div>

            <div class="form-group">
                <label for="category">Category:</label>
                <select id="category">
                    <option value="">Select Category</option>
                    <option value="Food">Food</option>
                    <option value="Transportation">Transportation</option>
                    <option value="School">School</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <button type="submit" id="add-expense-btn">Add Expense</button>
        </form>

        <div class="filter-section">
            <input type="text" id="search-expense" placeholder="Search expenses...">
            <select id="filter-category">
                <option value="">All Categories</option>
                <option value="Food">Food</option>
                <option value="Transportation">Transportation</option>
                <option value="School">School</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div id="expenses-container">
            <table id="expenses-table">
                <thead>
                    <tr>
                        <th>Expense Name</th>
                        <th>Amount (₱)</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="expenses-list">
                    <!-- Expenses will be added here dynamically -->
                </tbody>
            </table>

            <p id="no-expenses-message" class="no-expenses">No expenses recorded yet.</p>
        </div>

        <div class="total-section">
            <p>Total Expenses: <span id="total-amount">₱0.00</span></p>
            <p>Number of Expenses: <span id="expense-count">0</span></p>
            <button id="clear-all-btn">Clear All Expenses</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
